<div class="backdrop" (click)="cancelled.emit()"></div>
<div
  class="dialog"
  role="alertdialog"
  aria-modal="true"
  [attr.aria-label]="title()"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  (keydown)="onKeydown($event)"
>
  <h2 class="dialog__title">{{ title() }}</h2>
  @if (body()) {
    <p class="dialog__body">{{ body() }}</p>
  }
  @if (requireWord()) {
    <app-text-field
      name="typedConfirm"
      [label]="requireWordLabel()"
      [ngModel]="typed_()"
      (ngModelChange)="typed_.set($event)"
    />
  }
  <div class="dialog__actions">
    <app-button variant="secondary" (pressed)="cancelled.emit()">{{ cancelLabel() }}</app-button>
    <app-button
      [variant]="destructive() ? 'danger' : 'primary'"
      [disabled]="!canConfirm_()"
      (pressed)="confirmed.emit()"
      >{{ confirmLabel() }}</app-button
    >
  </div>
</div>
