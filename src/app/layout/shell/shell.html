<div class="shell">
  <header class="shell__top">
    <h1 class="shell__title">{{ appName }}</h1>
    <span class="shell__baby">{{ shell.babyLabel() }}</span>
    @if (parentName_()) {
      <span class="shell__parent">{{ parentName_() }}</span>
    }
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>

  @if (showNav_()) {
    <nav class="shell__nav">
      @for (tab of tabs; track tab.path) {
        <a
          class="tab"
          [routerLink]="tab.path"
          routerLinkActive="tab--active"
          [routerLinkActiveOptions]="{ exact: tab.exact }"
          ariaCurrentWhenActive="page"
        >
          <app-icon class="tab__icon" [slot]="tab.slot" [size]="24" />
          <span class="tab__label">{{ tab.label }}</span>
        </a>
      }
    </nav>
  }

  <app-toast />
  @if (confirm.request(); as req) {
    <app-confirm-dialog
      [title]="req.title"
      [body]="req.body"
      [confirmLabel]="req.confirmLabel"
      [cancelLabel]="req.cancelLabel"
      [destructive]="req.destructive"
      (confirmed)="confirm.answer(true)"
      (cancelled)="confirm.answer(false)"
    />
  }
</div>
