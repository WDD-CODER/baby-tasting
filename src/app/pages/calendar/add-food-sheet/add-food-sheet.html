<app-bottom-sheet [open]="open()" [title]="t.addFood" (closed)="close()">
  <input
    class="search"
    type="search"
    [attr.aria-label]="t.search"
    [placeholder]="t.search"
    [value]="query_()"
    (input)="onQuery($event)"
  />

  @if (preselected(); as food) {
    <h3 class="group">{{ suggestedLabel }}</h3>
    <ul class="list">
      <li>
        <button
          type="button"
          class="food food--preselected"
          aria-current="true"
          [class.food--selected]="isSelected(food)"
          [attr.aria-pressed]="isSelected(food)"
          (click)="toggle(food)"
        >
          <span class="food__check" aria-hidden="true">{{ isSelected(food) ? '✓' : '' }}</span>
          <span class="food__emoji" aria-hidden="true">{{ food.emoji | foodIcon }}</span>
          <span class="food__name">{{ food.name }}</span>
        </button>
      </li>
    </ul>
  }

  @if (recent().length) {
    <h3 class="group">{{ t.recent }}</h3>
    <ul class="list">
      @for (food of recent(); track food.id) {
        <li>
          <button
            type="button"
            class="food"
            [class.food--selected]="isSelected(food)"
            [attr.aria-pressed]="isSelected(food)"
            (click)="toggle(food)"
          >
            <span class="food__check" aria-hidden="true">{{ isSelected(food) ? '✓' : '' }}</span>
            <span class="food__emoji" aria-hidden="true">{{ food.emoji | foodIcon }}</span>
            <span class="food__name">{{ food.name }}</span>
          </button>
        </li>
      }
    </ul>
  }

  <h3 class="group">{{ t.allFoods }}</h3>
  <ul class="list">
    @for (food of matches(); track food.id) {
      <li>
        <button
          type="button"
          class="food"
          [class.food--selected]="isSelected(food)"
          [attr.aria-pressed]="isSelected(food)"
          (click)="toggle(food)"
        >
          <span class="food__check" aria-hidden="true">{{ isSelected(food) ? '✓' : '' }}</span>
          <span class="food__emoji" aria-hidden="true">{{ food.emoji | foodIcon }}</span>
          <span class="food__name">{{ food.name }}</span>
          @if (food.allergenId) {
            <span class="food__allergen" aria-hidden="true">{{ t.allergenBadge }}</span>
          }
        </button>
      </li>
    } @empty {
      <li class="none">{{ t.noFoods }}</li>
    }
  </ul>

  <button type="button" class="new" (click)="requestNew()">{{ newLabel_() }}</button>

  <div class="footer">
    <button type="button" class="footer__add" [disabled]="count_() === 0" (click)="confirm()">
      {{ addLabel_() }}
    </button>
  </div>
</app-bottom-sheet>
